<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaScore Verification UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.3rem; }
    input, button, textarea { width: 100%; padding: 0.5rem; }
    button { cursor: pointer; }
    #results { margin-top: 2rem; width: 100%; border-collapse: collapse; }
    #results th, #results td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
    #results th { background: #f0f0f0; }
  </style>
  <!-- PDF.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
  <h1>PharmaScore Verification UI</h1>
  <div class="form-group">
    <label for="pdfFiles">Select PDF file(s)</label>
    <input type="file" id="pdfFiles" multiple accept="application/pdf" />
  </div>
  <div class="form-group">
    <label for="runs">Number of runs per file</label>
    <input type="number" id="runs" min="1" value="1" />
  </div>
  <div class="form-group">
    <label for="delay">Delay between runs (ms)</label>
    <input type="number" id="delay" min="0" value="0" />
  </div>
  
  <button id="startBtn">Start Verification</button>

  <table id="results" hidden>
    <thead>
      <tr>
        <th>File</th>
        <th>Run</th>
        <th>Status</th>
        <th>Duration (ms)</th>
        <th>Confidence</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="verification_ui.js"></script>
</body>
</html>
